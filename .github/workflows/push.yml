name: Build

on:
  release:
    types: [created]

permissions:
  contents: write     # needed to upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: qzn3t_pad-linux-static-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: qzn3t_pad-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools musl-dev
        
    - name: Add target
      run: rustup target add ${{ matrix.target }}
        
    - name: Build 
      run: cargo build --release --target ${{ matrix.target }}
      
    - name: Package static binary
      run: |
        mkdir -p package
        cp target/${{ matrix.target }}/release/qzn3t_pad package/
        strip package/qzn3t_pad  # Optional: reduce binary size
        tar czvf ${{ matrix.binary_name }}.tar.gz -C package .
        
    - name: Upload file as release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./${{ matrix.binary_name }}.tar.gz
        asset_name: ${{ matrix.binary_name }}.tar.gz
        asset_content_type: application/gzip
