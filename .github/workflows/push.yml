name: Multi-Platform Build

# Trigger the workflow when a new release is created
on:
  release:
    types: [created]

# Set permissions for the workflow to upload release assets
permissions:
  contents: write     # Allows writing to repository contents

# Environment variables for the workflow
env:
  CARGO_TERM_COLOR: always  # Enables colored output in Cargo commands

# Define the jobs to run
jobs:
  build:
    
    # Use a strategy matrix to build for multiple platforms
    strategy:
      matrix:
        include:
          # Linux x86_64 (static build with MUSL)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            packages: musl-tools musl-dev alsa-utils libasound2-dev pkg-config
          
          # Linux aarch64 (Raspberry Pi)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64
            packages: musl-tools musl-dev gcc-aarch64-linux-gnu alsa-utils libasound2-dev pkg-config
          
          # MacOS
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            packages: ""

          
          # Windows (cross-compiled from Linux)
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            platform: windows-x86_64
            packages: mingw-w64

    # Run on the specified OS for each matrix configuration
    runs-on: ${{ matrix.os }}

    steps:
    # Step 1: Check out the repository code
    - uses: actions/checkout@v4
    
    # Step 2: Cache Rust dependencies to speed up builds
    - uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    # Step 3: Install cross-compilation dependencies
    - name: Install dependencies
      if: matrix.packages != ''
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
        fi
        
        # ARM64-specific packages
        if [[ "${{ matrix.platform }}" == "linux-aarch64" ]]; then
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get install -y binutils-aarch64-linux-gnu
          fi
        fi

    # Step 4: Set up Rust toolchain and targets
    - name: Setup Rust toolchain
      run: |
        rustup target add ${{ matrix.target }}
        if [[ "${{ matrix.target }}" == *-musl ]]; then
          rustup component add rust-std-${{ matrix.target }}
        fi

    # Step INSERTED: Configure linker and pkg-config for MUSL targets
    - name: Configure build environment for MUSL
      if: contains(matrix.target, 'linux-musl')
      run: |
        # For aarch64, set the linker
        if [[ "${{ matrix.target }}" == 'aarch64-unknown-linux-musl' ]]; then
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
        fi
        
        # Set pkg-config for cross-compilation
        echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV        

    # Step 5: Set linker for aarch64 target
    - name: Configure linker for aarch64
      if: matrix.target == 'aarch64-unknown-linux-musl'
      run: |
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
    
    # # Step 6: Run tests (optional)
    # - name: Run tests
    #   run: cargo test --release --target ${{ matrix.target }}

    # - name: Install ARM64 strip tool
    #   if: matrix.platform == 'linux-aarch64'
    #   run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

    # Step 7: Build the project for the specific target
    - name: Build for ${{ matrix.platform }}
      run: cargo build --release --target ${{ matrix.target }}
      
    # Step 8: Prepare the binary for distribution
    - name: Package binary
      run: |
        mkdir -p package
        binary_name="qzn3t_pad"
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          binary_name="${binary_name}.exe"
        fi
        
        cp target/${{ matrix.target }}/release/$binary_name package/
        
        # Strip debugging symbols (except on MacOS)
        # if [[ "${{ matrix.platform }}" != "linux-x86_64" ]]; then
        #   strip package/qzn3t_pad
        # fi
        
        # Create appropriate archive
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          cd package
          zip -r ../qzn3t_pad-macos-x86_64.zip .
          cd ..
        elif [[ "${{ matrix.target }}" == *"windows"* ]]; then
          cd package
          zip -r ../qzn3t_pad-windows-x86_64.zip .

          cd ..
        else
          tar czvf qzn3t_pad-${{ matrix.platform }}.tar.gz -C package .
        fi
        
    # Step 9: Upload the packaged binary as a release asset
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: qzn3t_pad-${{ matrix.platform }}.${{ matrix.target == 'x86_64-pc-windows-gnu' && 'zip' || matrix.os == 'macos-latest' && 'zip' || 'tar.gz' }}
        asset_name: qzn3t_pad-${{ matrix.platform }}.${{ matrix.target == 'x86_64-pc-windows-gnu' && 'zip' || matrix.os == 'macos-latest' && 'zip' || 'tar.gz' }}
        asset_content_type: ${{ matrix.target == 'x86_64-pc-windows-gnu' && 'application/zip' || matrix.os == 'macos-latest' && 'application/zip' || 'application/gzip' }}

