name: Multi-Platform Build

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux x86_64 (static build with Glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            packages: gcc-multilib libasound2-dev pkg-config
            linker: x86_64-linux-gnu-gcc
            rustflags: -C target-feature=+crt-static
          
          # Linux aarch64 (Raspberry Pi)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            packages: gcc-aarch64-linux-gnu pkg-config
            linker: aarch64-linux-gnu-gcc
            rustflags: -C target-feature=+crt-static
            extra_install: |
              sudo dpkg --add-architecture arm64
              sudo apt-get update
              sudo apt-get install -y libasound2-dev:arm64
              sudo mkdir -p /usr/lib/aarch64-linux-gnu
              sudo ln -s /usr/lib/aarch64-linux-gnu /usr/lib/aarch64-linux-gnu/lib
          
          # MacOS
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            packages: ""

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install dependencies
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          ${{ matrix.extra_install || 'echo "No extra install steps"' }}
        fi

    - name: Setup Rust toolchain
      run: |
        rustup target add ${{ matrix.target }}
        if [[ "${{ matrix.target }}" == *-gnu ]]; then
          rustup component add rust-std-${{ matrix.target }}
        fi

    - name: Configure build environment
      if: contains(matrix.target, 'linux-gnu')
      run: |
        echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]' '[:upper:]' | tr '-' '_')_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV
        echo "RUSTFLAGS=${{ matrix.rustflags }}" >> $GITHUB_ENV
        echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
        if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
        else
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
        fi

    - name: Build for ${{ matrix.platform }}
      run: cargo build --release --target ${{ matrix.target }}
      
    - name: Package binary
      run: |
        mkdir -p package
        binary_name="qzn3t_pad"
        cp target/${{ matrix.target }}/release/$binary_name package/
        
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          cd package
          zip -r ../qzn3t_pad-macos-x86_64.zip .
          cd ..
        else
          tar czvf qzn3t_pad-${{ matrix.platform }}.tar.gz -C package .
        fi
        
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: qzn3t_pad-${{ matrix.platform }}.${{ matrix.os == 'macos-latest' && 'zip' || 'tar.gz' }}
        asset_name: qzn3t_pad-${{ matrix.platform }}.${{ matrix.os == 'macos-latest' && 'zip' || 'tar.gz' }}
        asset_content_type: ${{ matrix.os == 'macos-latest' && 'application/zip' || 'application/gzip' }}
