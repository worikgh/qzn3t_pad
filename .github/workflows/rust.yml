name: Rust

on:
  push:
    branches: [ "mistress" ]
  pull_request:
    branches: [ "mistress" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: debian-12

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
