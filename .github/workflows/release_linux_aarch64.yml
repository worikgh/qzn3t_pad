name: Linux aarch64 Build (musl)

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-gnu

jobs:
  build_aarch64:
    name: Build for Raspberry Pi 5
    runs-on: debian-12
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        target: ${{ env.TARGET }}
        override: true

    - name: Install cross-compilation dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Configure Cargo for cross-compilation
      run: |
        echo "[target.${{ env.TARGET }}]" >> $HOME/.cargo/config.toml
        echo "linker = \"aarch64-linux-gnu-gcc\"" >> $HOME/.cargo/config.toml

    - name: Build the project
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --release --target=${{ env.TARGET }}

    - name: Upload artifact (for CI)
      uses: actions/upload-artifact@v3
      with:
        name: release-binary
        path: target/${{ env.TARGET }}/release/

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: target/${{ env.TARGET }}/release/YOUR_BINARY_NAME
        asset_name: YOUR_BINARY_NAME-aarch64-unknown-linux-gnu
        asset_content_type: application/octet-stream
        
