name: Linux aarch64 Build

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-gnu
  BINARY_NAME: qzn3t_pad

jobs:
  build_aarch64:
    name: Build for Raspberry Pi 5
    runs-on: debian-12  # Not ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ env.TARGET }}

    - name: Install dependencies
      run: |
        sudo dpkg --add-architecture arm64
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          crossbuild-essential-arm64 \
          libasound2-dev:arm64 \
          pkg-config

    - name: Configure Cargo
      run: |
        mkdir -p $HOME/.cargo
        cat > $HOME/.cargo/config.toml <<EOF
        [target.${{ env.TARGET }}]
        linker = "aarch64-linux-gnu-gcc"
        EOF
        
        echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
        echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> $GITHUB_ENV
        echo "RUSTFLAGS=-C linker=aarch64-linux-gnu-gcc -C link-arg=-L/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,-rpath-link=/usr/aarch64-linux-gnu/lib" >> $GITHUB_ENV

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/${{ env.TARGET }}/release/.fingerprint
          target/${{ env.TARGET }}/release/build
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ env.TARGET }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ env.TARGET }}-
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --release --target ${{ env.TARGET }}
      env:
        PKG_CONFIG_ALLOW_CROSS: 1
        PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
        PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
        RUSTFLAGS: "-C linker=aarch64-linux-gnu-gcc -C link-arg=-L/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,-rpath-link=/usr/aarch64-linux-gnu/lib"

    - name: Verify binary
      run: file target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}

    # - name: Strip binary (optional)
    #   run: aarch64-linux-gnu-strip target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BINARY_NAME }}-aarch64
        path: target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}
        asset_name: ${{ env.BINARY_NAME }}-aarch64
        asset_content_type: application/octet-stream
