name: Linux aarch64 Build

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-gnu
  BINARY_NAME: qzn3t_pad

jobs:
  build_aarch64:
    name: Build for Raspberry Pi 5
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Configure Cargo
      run: |
        mkdir -p $HOME/.cargo
        echo "[target.${{ env.TARGET }}]" > $HOME/.cargo/config.toml
        echo 'linker = "aarch64-linux-gnu-gcc"' >> $HOME/.cargo/config.toml

    # Cache Rust dependencies
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/${{ env.TARGET }}/release/.fingerprint
          target/${{ env.TARGET }}/release/build
          target/release/.fingerprint
          target/release/build
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    # Cache Rust toolchain (if you want to cache the toolchain installation)
    - name: Cache Rust toolchain
      uses: actions/cache@v3
      with:
        path: ~/.rustup
        key: ${{ runner.os }}-rustup-${{ env.TARGET }}
        restore-keys: |
          ${{ runner.os }}-rustup-

    - name: Build with rust-build.action
      uses: rust-build/rust-build.action@v1.4.5
      with:
        TOOLCHAIN_VERSION: stable
        RUSTTARGET: ${{ env.TARGET }}
        EXTRA_COMMAND_FLAGS: --release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BINARY_NAME }}-aarch64
        path: target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}
        asset_name: ${{ env.BINARY_NAME }}-aarch64
        asset_content_type: application/octet-stream
